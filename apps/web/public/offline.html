<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline | WonFlow</title>
    <link rel="icon" href="/brand/wonflow-icon-192.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --panel: rgb(255 255 255 / 0.72);
        --ink: #0f172a;
        --muted: #64748b;
        --line: rgb(15 23 42 / 0.08);
        --accent: #2563eb;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --panel: rgb(255 255 255 / 0.05);
          --ink: #e2e8f0;
          --muted: #94a3b8;
          --line: rgb(255 255 255 / 0.1);
          --accent: #60a5fa;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }

      main {
        width: 100%;
        max-width: 26rem;
        padding: 28px;
        text-align: center;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(18px);
        box-shadow: 0 24px 60px rgb(15 23 42 / 0.1);
      }

      img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.15rem;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0;
        font-size: 0.86rem;
        line-height: 1.55;
        color: var(--muted);
      }

      button {
        margin-top: 20px;
        width: 100%;
        min-height: 44px;
        border: 0;
        border-radius: 14px;
        background: var(--accent);
        color: #fff;
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.08);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/wonflow-icon-192.png" alt="WonFlow" />
      <h1>WonFlow is offline</h1>
      <!--
        Deliberately does not offer a cached copy of the page. Signed-in
        screens carry patient information and are never written to a cache
        this device shares between accounts.
      -->
      <p>
        This device has no connection right now. Anything you saved while
        online is safe on the server — reconnect and it will be here.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
