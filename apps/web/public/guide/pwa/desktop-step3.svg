<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="dlgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="680" height="340" rx="16" fill="url(#bgGrad3)"/>
  <rect width="678" height="338" x="1" y="1" rx="15" stroke="#334155" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Dimmed Background Web Page -->
  <rect x="30" y="30" width="620" height="280" rx="12" fill="#070a12" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="30" y="30" width="620" height="46" rx="12" fill="#0f172a"/>
  <!-- Window Dots -->
  <circle cx="52" cy="53" r="5" fill="#475569"/>
  <circle cx="68" cy="53" r="5" fill="#475569"/>
  <circle cx="84" cy="53" r="5" fill="#475569"/>
  <rect x="110" y="42" width="220" height="22" rx="11" fill="#1e293b"/>
  <text x="125" y="57" fill="#64748b" font-size="10">wonflow.hospital</text>

  <!-- Backdrop Dimmer Effect -->
  <rect x="30" y="76" width="620" height="234" fill="#000000" fill-opacity="0.55"/>

  <!-- ★ NATIVE INSTALL CONFIRMATION DIALOG ★ -->
  <g filter="url(#dlgShadow)">
    <rect x="165" y="65" width="350" height="200" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    
    <!-- Top Bar with Close X -->
    <text x="185" y="93" fill="#f9fafb" font-size="15" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Install app?</text>
    <path d="M 485 82 L 495 92 M 495 82 L 485 92" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round"/>

    <!-- App Identity Row -->
    <g transform="translate(185, 110)">
      <!-- App Icon -->
      <rect width="52" height="52" rx="12" fill="#1e40af" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M 12 18 L 19 36 L 26 25 L 33 36 L 40 18" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- App Name & Domain -->
      <text x="64" y="24" fill="#ffffff" font-size="14" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">WonFlow</text>
      <text x="64" y="42" fill="#9ca3af" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">wonflow.hospital · Clinical Portal</text>
    </g>

    <!-- Dialog Explanatory Subtext -->
    <text x="185" y="185" fill="#6b7280" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif">WonFlow will open in its own clean window.</text>

    <!-- Action Buttons -->
    <!-- Cancel Button -->
    <rect x="305" y="210" width="85" height="36" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="328" y="233" fill="#d1d5db" font-size="12" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Cancel</text>

    <!-- ★ INSTALL BUTTON (Pulsing / Glowing) ★ -->
    <rect x="400" y="210" width="95" height="36" rx="8" fill="url(#btnGrad)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="432" y="233" fill="#ffffff" font-size="12.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Install</text>

    <!-- Click Cursor Mockup -->
    <g transform="translate(470, 230)">
      <polygon points="0,0 0,16 5,12 10,21 13,19 8,10 14,10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Step 3 Callout Indicator -->
  <g transform="translate(40, 240)">
    <rect width="250" height="52" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="26" cy="26" r="12" fill="#10b981"/>
    <text x="22" y="31" fill="#064e3b" font-size="13" font-weight="900">3</text>
    <text x="48" y="21" fill="#f8fafc" font-size="12" font-weight="700">Click "Install" to Confirm</text>
    <text x="48" y="38" fill="#a7f3d0" font-size="10.5">Opens instantly in its own window</text>
  </g>
</svg>
