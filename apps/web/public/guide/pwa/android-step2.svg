<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="andrBg2" x1="0" y1="0" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="andrMenuGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="andrMenuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <rect width="680" height="340" rx="16" fill="url(#andrBg2)"/>
  <rect width="678" height="338" x="1" y="1" rx="15" stroke="#1e293b" stroke-width="1"/>

  <!-- Android Phone Mockup Frame (Centered) -->
  <g transform="translate(190, 20)">
    <rect width="300" height="300" rx="30" fill="#090d16" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Dimmed Screen Area -->
    <rect x="12" y="32" width="276" height="255" rx="4" fill="#050811"/>

    <!-- Top Bar with 3 Dots Active -->
    <rect x="12" y="32" width="276" height="50" fill="#1e293b"/>
    <circle cx="250" cy="57" r="14" fill="#334155"/>
    <circle cx="250" cy="51" r="2" fill="#ffffff"/>
    <circle cx="250" cy="57" r="2" fill="#ffffff"/>
    <circle cx="250" cy="63" r="2" fill="#ffffff"/>

    <!-- ★ CHROME OVERFLOW MENU CARD (SLIDING DOWN FROM TOP-RIGHT) ★ -->
    <g filter="url(#andrMenuShadow)">
      <rect x="90" y="65" width="190" height="210" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      
      <!-- Menu Item: New tab -->
      <text x="106" y="90" fill="#94a3b8" font-size="11">New tab</text>
      <!-- Menu Item: History -->
      <text x="106" y="116" fill="#94a3b8" font-size="11">History</text>
      <!-- Menu Item: Downloads -->
      <text x="106" y="142" fill="#94a3b8" font-size="11">Downloads</text>

      <line x1="100" y1="154" x2="270" y2="154" stroke="#334155" stroke-width="0.8"/>

      <!-- ★ HIGHLIGHTED MENU ITEM: "Install app" ★ -->
      <g transform="translate(95, 162)">
        <rect width="180" height="36" rx="8" fill="url(#andrMenuGlow)" stroke="#34d399" stroke-width="1.5"/>
        <!-- Smartphone with Arrow Icon -->
        <rect x="10" y="9" width="12" height="18" rx="2" stroke="#ffffff" stroke-width="1.4" fill="none"/>
        <path d="M 16 14 L 16 20 M 14 18 L 16 20 L 18 18" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        
        <text x="28" y="22" fill="#ffffff" font-size="11.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Install app</text>
      </g>

      <!-- Menu Item: Add to Home screen -->
      <g transform="translate(95, 204)">
        <rect width="180" height="30" rx="6" fill="#0f172a" fill-opacity="0.4"/>
        <text x="28" y="20" fill="#cbd5e1" font-size="10.5">Add to Home screen</text>
      </g>

      <!-- Menu Item: Settings -->
      <text x="106" y="258" fill="#64748b" font-size="11">Settings</text>
    </g>
  </g>

  <!-- Left Callout -->
  <g transform="translate(30, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="12" fill="#6366f1"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="900">2</text>
    <text x="48" y="32" fill="#f8fafc" font-size="11.5" font-weight="700">Choose Option</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="10.5">Select</text>
    <text x="14" y="74" fill="#34d399" font-size="11" font-weight="700">"Install app"</text>
  </g>

  <!-- Right Callout -->
  <g transform="translate(510, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="28" fill="#34d399" font-size="11" font-weight="700">Quick Install</text>
    <text x="14" y="50" fill="#94a3b8" font-size="10">Some devices show "Add to Home screen" which provides the identical app experience.</text>
  </g>
</svg>
