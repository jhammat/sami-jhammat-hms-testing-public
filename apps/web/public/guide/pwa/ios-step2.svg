<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="iosBg2" x1="0" y1="0" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="sheetGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="sheetShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="680" height="340" rx="16" fill="url(#iosBg2)"/>
  <rect width="678" height="338" x="1" y="1" rx="15" stroke="#1e293b" stroke-width="1"/>

  <!-- Center iPhone Screen Mockup -->
  <g transform="translate(190, 20)">
    <rect width="300" height="300" rx="36" fill="#090d16" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Dimmed Page in Background -->
    <rect x="12" y="38" width="276" height="250" rx="4" fill="#050811"/>
    
    <!-- ★ iOS SHARE SHEET SLIDING UP ★ -->
    <g filter="url(#sheetShadow)">
      <path d="M 12 85 Q 12 70 26 70 L 274 70 Q 288 70 288 85 L 288 288 L 12 288 Z" fill="#1e293b"/>
      
      <!-- Drag Handle -->
      <rect x="132" y="78" width="36" height="4" rx="2" fill="#64748b"/>

      <!-- Webpage Preview Row -->
      <g transform="translate(24, 94)">
        <rect width="32" height="32" rx="8" fill="#3b82f6"/>
        <path d="M 7 11 L 12 21 L 16 15 L 20 21 L 25 11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="15" fill="#f8fafc" font-size="11" font-weight="700">WonFlow Clinical</text>
        <text x="42" y="27" fill="#94a3b8" font-size="9">wonflow.hospital</text>
      </g>

      <!-- Action Row 1: Copy / Reading List -->
      <rect x="24" y="136" width="252" height="36" rx="8" fill="#0f172a" fill-opacity="0.6"/>
      <text x="36" y="158" fill="#94a3b8" font-size="11">Copy link</text>

      <!-- ★ HIGHLIGHTED ROW: "Add to Home Screen" ★ -->
      <g transform="translate(24, 180)">
        <rect width="252" height="44" rx="10" fill="url(#sheetGlow)" stroke="#38bdf8" stroke-width="1.6"/>
        
        <!-- Plus in Square Icon -->
        <rect x="12" y="10" width="24" height="24" rx="6" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="1.5"/>
        <line x1="24" y1="16" x2="24" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="18" y1="22" x2="30" y2="22" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        
        <text x="44" y="27" fill="#ffffff" font-size="12" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Add to Home Screen</text>
        
        <!-- Action Arrow -->
        <circle cx="234" cy="22" r="8" fill="#ffffff" fill-opacity="0.25"/>
        <path d="M 232 18 L 236 22 L 232 26" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Action Row 3: Add Bookmark -->
      <rect x="24" y="232" width="252" height="34" rx="8" fill="#0f172a" fill-opacity="0.6"/>
      <text x="36" y="253" fill="#94a3b8" font-size="11">Add Bookmark</text>

      <!-- Home Indicator -->
      <rect x="95" y="280" width="110" height="4" rx="2" fill="#94a3b8"/>
    </g>
  </g>

  <!-- Left Side Callout -->
  <g transform="translate(30, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="12" fill="#6366f1"/>
    <text x="24" y="33" fill="#ffffff" font-size="13" font-weight="900">2</text>
    <text x="48" y="32" fill="#f8fafc" font-size="11.5" font-weight="700">Choose Option</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="10.5">Scroll down sheet &amp;</text>
    <text x="14" y="74" fill="#38bdf8" font-size="10.5" font-weight="700">"Add to Home Screen"</text>
  </g>

  <!-- Right Side Callout -->
  <g transform="translate(510, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="14" y="28" fill="#38bdf8" font-size="11" font-weight="700">Square Plus Icon</text>
    <text x="14" y="50" fill="#94a3b8" font-size="10">Look for the square icon with a plus [+] sign inside the share options.</text>
  </g>
</svg>
