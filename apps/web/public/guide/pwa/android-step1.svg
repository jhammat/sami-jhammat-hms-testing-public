<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="andrBg1" x1="0" y1="0" x2="680" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="andrGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="andrFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="680" height="340" rx="16" fill="url(#andrBg1)"/>
  <rect width="678" height="338" x="1" y="1" rx="15" stroke="#1e293b" stroke-width="1"/>

  <!-- Android Phone Mockup Frame (Centered) -->
  <g transform="translate(190, 20)">
    <!-- Phone Outer Body -->
    <rect width="300" height="300" rx="30" fill="#090d16" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Top Center Camera Punch Hole -->
    <circle cx="150" cy="18" r="6" fill="#000000" stroke="#1e293b" stroke-width="1"/>

    <!-- Screen Area -->
    <rect x="12" y="32" width="276" height="255" rx="4" fill="#0f172a"/>

    <!-- Chrome Top Bar (Android) -->
    <rect x="12" y="32" width="276" height="52" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <!-- Home / Lock Icon -->
    <rect x="24" y="44" width="168" height="28" rx="14" fill="#0b0f19" stroke="#334155" stroke-width="1"/>
    <circle cx="38" cy="58" r="4" fill="#10b981"/>
    <text x="48" y="62" fill="#e2e8f0" font-size="11" font-weight="500">wonflow.hospital</text>

    <!-- Tab Counter Box [1] -->
    <rect x="200" y="48" width="18" height="18" rx="4" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
    <text x="209" y="61" fill="#94a3b8" font-size="10" font-weight="700" text-anchor="middle">1</text>

    <!-- ★ HIGHLIGHTED THREE DOTS MENU (⋮) ★ -->
    <circle cx="250" cy="57" r="18" fill="url(#andrGlow)" fill-opacity="0.3" filter="url(#andrFilter)"/>
    <circle cx="250" cy="57" r="16" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.8"/>
    <circle cx="250" cy="51" r="2.2" fill="#38bdf8"/>
    <circle cx="250" cy="57" r="2.2" fill="#38bdf8"/>
    <circle cx="250" cy="63" r="2.2" fill="#38bdf8"/>

    <!-- Android Web Page Preview -->
    <rect x="24" y="96" width="252" height="38" rx="8" fill="#1e293b"/>
    <rect x="34" y="105" width="20" height="20" rx="5" fill="#3b82f6"/>
    <text x="62" y="119" fill="#ffffff" font-size="11" font-weight="700">WonFlow Portal</text>

    <rect x="24" y="144" width="252" height="55" rx="8" fill="#172033" stroke="#1e293b"/>
    <text x="36" y="166" fill="#38bdf8" font-size="11" font-weight="600">Patient Care Hub</text>
    <text x="36" y="184" fill="#64748b" font-size="9.5">Ready for fast, offline clinical access</text>

    <!-- Android Bottom Navigation Bar (Back, Home, Recents) -->
    <rect x="12" y="258" width="276" height="30" fill="#0b0f19"/>
    <!-- Triangle Back -->
    <polygon points="50,273 60,267 60,279" fill="#64748b"/>
    <!-- Circle Home -->
    <circle cx="150" cy="273" r="6" stroke="#64748b" stroke-width="1.5" fill="none"/>
    <!-- Square Recents -->
    <rect x="238" y="267" width="12" height="12" rx="2" stroke="#64748b" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Left Callout -->
  <g transform="translate(30, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="12" fill="#38bdf8"/>
    <text x="24" y="33" fill="#020617" font-size="13" font-weight="900">1</text>
    <text x="48" y="32" fill="#f8fafc" font-size="11.5" font-weight="700">Tap 3 Dots</text>
    <text x="14" y="58" fill="#cbd5e1" font-size="10.5">Top-right corner</text>
    <text x="14" y="74" fill="#94a3b8" font-size="10">Opens Chrome's overflow settings menu.</text>
  </g>

  <!-- Right Callout -->
  <g transform="translate(510, 110)">
    <rect width="140" height="96" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="28" fill="#a7f3d0" font-size="11" font-weight="700">Android Chrome</text>
    <text x="14" y="50" fill="#94a3b8" font-size="10">Works on all modern Samsung, Xiaomi, and Google Pixel devices.</text>
  </g>
</svg>
